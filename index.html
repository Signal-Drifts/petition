<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross-Company Petition to Reinstate Jensen Huang as NVIDIA CEO | Signal Drift</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Cross-Company Petition</h1>
  <p class="sub">Reinstate Jensen Huang as NVIDIA CEO</p>
  <form id="signForm">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <label for="company">Company (optional):</label>

    <button type="submit">Sign</button>

  <p class="sig">Signatures: <span id="count"></span></p>
  <div id="signaturesList"></div>
