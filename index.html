<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross-Company Petition to Reinstate Jensen Huang as NVIDIA CEO | Signal Drift</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Cross-Company Petition to Reinstate Jensen Huang as NVIDIA CEO</h1>
  </header>

  <main>
    <section class="sign-form">
      <form id="signForm">
        <label>
          Full Name or Initials <span class="required">*</span>
          <input type="text" id="name" name="name" required placeholder="John Doe or J.D.">
        </label>
        <label>
          Company (optional)
          <input type="text" id="company" name="company">
        </label>
        <button type="submit">Sign the Petition</button>
      </form>
    </section>

    <section class="signatures">
      <h2>Already Signed <span id="count">(loading...)</span></h2>
      <div id="signaturesList">
        <p>Loading signatures...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Hosted on GitHub Pages by <a href="https://signaldrifts.substack.com/welcome">Signal Drift</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
